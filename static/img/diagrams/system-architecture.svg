<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 600" role="img" aria-labelledby="t d">
  <title id="t">TwinSite system architecture</title>
  <desc id="d">The browser talks to the Flask web process on port 5050, which serves pages, the /api blueprints and a /v1 reverse proxy. The proxy reaches the platform API on port 8080, which shares SQLite and a blob store with the mission worker that runs the 13 agents. Flask reads the bundled data_ready grids. The platform reaches NASA and OpenStreetMap sources and free AI providers.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ff8a3d"/></marker>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;fill:#ece6df}
      .h{font-size:15px;font-weight:700}.s{font-size:12.5px;fill:#c9c0b7}.m{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;fill:#ffb36b}
      .k{font-size:11px;letter-spacing:.14em;fill:#9b9188;font-weight:600}
      .box{fill:#16110e;stroke:rgba(255,140,60,.45);stroke-width:1.4}.sub{fill:#0f0c0b;stroke:rgba(255,255,255,.12)}
      .ext{fill:#0e1424;stroke:rgba(143,179,255,.45);stroke-width:1.4}.store{fill:#121016;stroke:rgba(196,181,253,.45);stroke-width:1.4}
      .ln{stroke:#ff8a3d;stroke-width:1.6;fill:none}.lb{stroke:#8fb3ff;stroke-width:1.6;fill:none;stroke-dasharray:5 4}
    </style>
  </defs>
  <rect width="1120" height="600" fill="#0b0a0c"/>
  <text class="k" x="30" y="36">CLIENT</text><text class="k" x="250" y="36">WEB · FLASK</text><text class="k" x="590" y="36">PLATFORM</text><text class="k" x="880" y="36">EXTERNAL</text>

  <!-- Browser -->
  <rect class="box" x="30" y="56" width="180" height="300" rx="14"/>
  <text class="h" x="48" y="86">Browser</text>
  <text class="s" x="48" y="114">Home  /</text>
  <text class="s" x="48" y="138">Mission Control  /app</text>
  <text class="s" x="48" y="162">Auto Mode  /auto</text>
  <text class="s" x="48" y="186">Data Hub  /data</text>
  <text class="s" x="48" y="210">Console  /console/</text>
  <text class="s" x="48" y="234">Resources, sitemap</text>
  <text class="s" x="48" y="270">CesiumJS · Leaflet</text>
  <text class="s" x="48" y="292">Chart.js · React</text>
  <text class="s" x="48" y="314">(console)</text>

  <!-- Flask -->
  <rect class="box" x="250" y="56" width="300" height="400" rx="14"/>
  <text class="h" x="268" y="86">Flask web</text><text class="m" x="460" y="86">:5050</text>
  <rect class="sub" x="268" y="102" width="264" height="58" rx="10"/>
  <text class="s" x="282" y="126">Pages + static files</text>
  <text class="s" x="282" y="146">React console build at /console/</text>
  <rect class="sub" x="268" y="172" width="264" height="104" rx="10"/>
  <text class="m" x="282" y="196">/api blueprints</text>
  <text class="s" x="282" y="218">similarity · ml · layers · report</text>
  <text class="s" x="282" y="240">assistant · data · auto · ai</text>
  <text class="s" x="282" y="262">services: analysis, cleaning</text>
  <rect class="sub" x="268" y="288" width="264" height="58" rx="10"/>
  <text class="m" x="282" y="312">/v1/* reverse proxy</text>
  <text class="s" x="282" y="332">single origin for the platform API</text>
  <rect class="store" x="268" y="364" width="264" height="74" rx="10"/>
  <text class="s" x="282" y="388" style="fill:#ece6df;font-weight:600">data_ready/ (bundled)</text>
  <text class="s" x="282" y="408">harmonized Moon, Mars, Earth grids</text>
  <text class="s" x="282" y="426">processed ~1 km Earth cells</text>

  <!-- Platform -->
  <rect class="box" x="590" y="56" width="250" height="178" rx="14"/>
  <text class="h" x="608" y="86">Platform API</text><text class="m" x="770" y="86">:8080</text>
  <text class="s" x="608" y="112">python -m twinsite.api</text>
  <text class="s" x="608" y="136">missions · agents · evidence</text>
  <text class="s" x="608" y="158">science gateway · data catalog</text>
  <text class="s" x="608" y="180">contracts validated (JSON Schema)</text>
  <text class="m" x="608" y="210">/v1/openapi.json</text>

  <rect class="box" x="590" y="256" width="250" height="110" rx="14"/>
  <text class="h" x="608" y="286">Mission worker</text>
  <text class="s" x="608" y="312">python -m twinsite.jobs</text>
  <text class="s" x="608" y="334">queue, leases, retries</text>
  <text class="s" x="608" y="356">13 agents (A01–A13)</text>

  <rect class="store" x="590" y="388" width="250" height="68" rx="14"/>
  <text class="h" x="608" y="416">SQLite + blob store</text>
  <text class="s" x="608" y="440">TWINSITE_DATA_DIR (persistent)</text>

  <!-- External -->
  <rect class="ext" x="880" y="56" width="210" height="246" rx="14"/>
  <text class="h" x="898" y="86">Open data sources</text>
  <text class="s" x="898" y="112">NASA PDS · MOLA, LOLA</text>
  <text class="s" x="898" y="134">LRO Diviner</text>
  <text class="s" x="898" y="156">SRTM (LP DAAC)</text>
  <text class="s" x="898" y="178">AWS Terrain Tiles</text>
  <text class="s" x="898" y="200">NASA POWER · GIBS · CMR</text>
  <text class="s" x="898" y="222">OpenStreetMap Overpass</text>
  <text class="s" x="898" y="244">Open-Meteo geocoding</text>
  <text class="s" x="898" y="268">HTTPS, cached, SHA-256</text>
  <text class="s" x="898" y="288">verified raw assets</text>

  <rect class="ext" x="880" y="324" width="210" height="132" rx="14"/>
  <text class="h" x="898" y="354">Free AI providers</text>
  <text class="s" x="898" y="380">Groq · Cloudflare · Gemini</text>
  <text class="s" x="898" y="402">Mistral · OpenRouter · NVIDIA</text>
  <text class="s" x="898" y="424">optional; keys on server only</text>
  <text class="s" x="898" y="444">public science context only</text>

  <!-- arrows -->
  <path class="ln" d="M210 150 H246" marker-end="url(#a)"/>
  <path class="ln" d="M532 317 H560 V145 H586" marker-end="url(#a)"/>
  <path class="ln" d="M715 234 V252" marker-end="url(#a)"/>
  <path class="ln" d="M715 366 V384" marker-end="url(#a)"/>
  <path class="ln" d="M268 401 H259 V226 H264" marker-end="url(#a)"/>
  <path class="lb" d="M840 140 H876" marker-end="url(#a)"/>
  <path class="lb" d="M840 310 H860 V390 H876" marker-end="url(#a)"/>
  <path class="lb" d="M532 240 H572 V500 H985 V460" marker-end="url(#a)"/>

  <text class="s" x="268" y="484">Flask also calls AI directly for the assistant and report narrative.</text>
  <rect x="30" y="530" width="1060" height="44" rx="10" fill="#120f0d" stroke="rgba(255,255,255,.08)"/>
  <path class="ln" d="M50 552 H86" marker-end="url(#a)"/><text class="s" x="96" y="556">internal HTTP / process</text>
  <path class="lb" d="M300 552 H336" marker-end="url(#a)"/><text class="s" x="346" y="556">outbound HTTPS to public services</text>
  <text class="s" x="640" y="556">Deterministic code owns every number; AI only explains.</text>
</svg>
