# Shared TwinSite site body (static SPA + /v1 reverse proxy). Included by both server blocks.
root /opt/twinsite/frontend/dist;
access_log off;
client_max_body_size 1m;
server_tokens off;
gzip on;
gzip_types text/css application/javascript application/json image/svg+xml;
include /opt/twinsite/ops/vm/nginx-headers.conf;

# API: prefix is NOT stripped (proxy_pass has no URI part), so /v1/... reaches the API unchanged.
location /v1/ {
    limit_req zone=twinsite burst=40 nodelay;
    proxy_pass http://127.0.0.1:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
}
# Content-hashed build assets are immutable.
location /assets/ {
    include /opt/twinsite/ops/vm/nginx-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
}
# SPA fallback: deep links such as /analysis/run-... and /data/<id> serve index.html.
location / {
    include /opt/twinsite/ops/vm/nginx-headers.conf;
    add_header Cache-Control "no-cache" always;
    try_files $uri $uri/ /index.html;
}
location ~ /\. { deny all; }
