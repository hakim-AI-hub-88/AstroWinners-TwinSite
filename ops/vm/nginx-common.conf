# Shared TwinSite site body, included by every server block (nginx.conf, nginx-https.conf.example).
# Flask (gunicorn, 127.0.0.1:5050) is the origin for every page; nginx serves only static files and
# sends /v1 straight to the platform API. nginx drops server-level add_header directives in any
# location that sets its own, so every location includes its header file again.
server_tokens off;
client_max_body_size 2m;
gzip on;
gzip_types text/css application/javascript application/json application/xml image/svg+xml text/csv;

# Inherited by every proxied location below (none of them sets its own proxy_set_header).
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $host;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host $host;
proxy_connect_timeout 5s;

include /srv/twinsite/app/ops/vm/nginx-headers.conf;

# Platform API: the prefix is NOT stripped (proxy_pass has no URI part), so /v1/... arrives unchanged.
location /v1/ {
    limit_req zone=twinsite burst=80 nodelay;
    include /srv/twinsite/app/ops/vm/nginx-console-headers.conf;
    proxy_pass http://127.0.0.1:8080;
    proxy_read_timeout 60s;
}

# Flask static files (CSS, JS, images) straight from the checkout.
location /static/ {
    alias /srv/twinsite/app/static/;
    include /srv/twinsite/app/ops/vm/nginx-headers.conf;
    add_header Cache-Control "public, max-age=86400" always;
}

# React mission console: content-hashed Vite assets are immutable.
location /console/assets/ {
    alias /srv/twinsite/app/frontend/dist/assets/;
    include /srv/twinsite/app/ops/vm/nginx-console-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
}

# Console HTML and deep links (/console/analysis/run-...): Flask serves index.html (SPA fallback),
# or a build-instructions page when frontend/dist is missing.
location /console {
    include /srv/twinsite/app/ops/vm/nginx-console-headers.conf;
    add_header Cache-Control "no-cache" always;
    proxy_pass http://127.0.0.1:5050;
    proxy_read_timeout 30s;
}

# Everything else: Flask pages and JSON APIs (/, /app, /auto, /data, /resources, /api/*, sitemap ...).
# Report and auto-mode calls can take minutes: matches gunicorn --timeout 180.
location / {
    include /srv/twinsite/app/ops/vm/nginx-headers.conf;
    proxy_pass http://127.0.0.1:5050;
    proxy_read_timeout 180s;
    proxy_send_timeout 180s;
}

location ~ /\. { deny all; }
