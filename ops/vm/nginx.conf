# Include in nginx's http context. Configure the approved hostname/TLS before public deployment.
limit_req_zone $binary_remote_addr zone=twinsite:10m rate=5r/s;
server {
    listen 127.0.0.1:8081;
    server_name localhost;
    root /opt/twinsite/frontend/dist;
    access_log off;
    client_max_body_size 1m;
    add_header X-Content-Type-Options nosniff always;
    location /v1/ {
        limit_req zone=twinsite burst=20 nodelay;
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_read_timeout 30s;
    }
    location / { try_files $uri $uri/ /index.html; }
    location ~ /\. { deny all; }
}
