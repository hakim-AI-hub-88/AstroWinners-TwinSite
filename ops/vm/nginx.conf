# Include in nginx's http context. Loopback-only until an approved hostname/TLS exists;
# see nginx-https.conf.example for the public server block.
limit_req_zone $binary_remote_addr zone=twinsite:10m rate=5r/s;
server {
    listen 127.0.0.1:8081;
    server_name localhost;
    include /opt/twinsite/ops/vm/nginx-common.conf;
}
