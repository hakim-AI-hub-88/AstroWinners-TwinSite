# TwinSite site for nginx's http context (Debian/Ubuntu: /etc/nginx/conf.d/twinsite.conf).
# Loopback-only block for local health checks and smoke tests; the public TLS server block lives in
# nginx-https.conf.example. Routing (nginx-common.conf):
#   /v1/              -> platform API     127.0.0.1:8080  (python -m twinsite.api)
#   /static/          -> files            /srv/twinsite/app/static/
#   /console/assets/  -> files            /srv/twinsite/app/frontend/dist/assets/ (immutable, hashed)
#   everything else   -> Flask (gunicorn) 127.0.0.1:5050  (pages, /api/*, /console/ SPA fallback)
limit_req_zone $binary_remote_addr zone=twinsite:10m rate=10r/s;
server {
    listen 127.0.0.1:8081;
    server_name localhost;
    include /srv/twinsite/app/ops/vm/nginx-common.conf;
}
