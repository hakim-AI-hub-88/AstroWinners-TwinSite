# Security headers. nginx drops server-level add_header in any location that sets its own,
# so every such location includes this file again.
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy no-referrer always;
add_header X-Frame-Options DENY always;
add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob: https://gibs.earthdata.nasa.gov; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://gibs.earthdata.nasa.gov; worker-src 'self' blob:; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
