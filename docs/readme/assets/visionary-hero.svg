<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="t d">
  <title id="t">TwinSite Visionary Platform</title>
  <desc id="d">Animated banner: Earth, the Moon and Mars on orbits around the TwinSite wordmark, with the line Agentic Auto Mode, Data Hub, 13 agents, 7 free AI providers.</desc>
  <style>
    .bg{fill:#07060a}
    .orbit{fill:none;stroke:#f0c27a;stroke-opacity:.18;stroke-width:1.2;stroke-dasharray:4 6}
        .twinkle{animation:tw 3.2s ease-in-out infinite}
    .twinkle.b{animation-delay:1.1s}.twinkle.c{animation-delay:2.2s}
    .title{font:700 64px 'Segoe UI',Helvetica,Arial,sans-serif;letter-spacing:10px;fill:url(#gold)}
    .sub{font:600 18px 'Segoe UI',Helvetica,Arial,sans-serif;letter-spacing:4px;fill:#e7d6b8}
    .tag{font:500 15px 'Segoe UI',Helvetica,Arial,sans-serif;fill:#ff8f4a;letter-spacing:2px}
    .reveal{opacity:0;animation:in 1.2s ease-out forwards}
    .r2{animation-delay:.6s}.r3{animation-delay:1.2s}
    .scan{animation:scan 5s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    @keyframes tw{0%,100%{opacity:.2}50%{opacity:1}}
    @keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
    @keyframes scan{from{transform:translateX(-300px)}to{transform:translateX(1500px)}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important;opacity:1!important}}
  </style>
  <defs>
    <linearGradient id="gold" x1="0" x2="1"><stop offset="0" stop-color="#ffd59a"/><stop offset=".5" stop-color="#ff8f4a"/><stop offset="1" stop-color="#f0c27a"/></linearGradient>
    <radialGradient id="earth"><stop offset="0" stop-color="#7fd0ff"/><stop offset="1" stop-color="#1c5aa6"/></radialGradient>
    <radialGradient id="mars"><stop offset="0" stop-color="#ffb07a"/><stop offset="1" stop-color="#b3431e"/></radialGradient>
    <radialGradient id="moon"><stop offset="0" stop-color="#f4f1ea"/><stop offset="1" stop-color="#8d8a84"/></radialGradient>
    <radialGradient id="glow"><stop offset="0" stop-color="#ff8f4a" stop-opacity=".25"/><stop offset="1" stop-color="#ff8f4a" stop-opacity="0"/></radialGradient>
    <linearGradient id="beam" x1="0" x2="1"><stop offset="0" stop-color="#ff8f4a" stop-opacity="0"/><stop offset=".5" stop-color="#ff8f4a" stop-opacity=".35"/><stop offset="1" stop-color="#ff8f4a" stop-opacity="0"/></linearGradient>
  </defs>
  <rect class="bg" width="1200" height="360" rx="18"/>
  <ellipse cx="600" cy="180" rx="420" ry="150" fill="url(#glow)"/>
  <g fill="#fff">
    <circle class="twinkle" cx="80" cy="60" r="1.6"/><circle class="twinkle b" cx="210" cy="300" r="1.2"/>
    <circle class="twinkle c" cx="340" cy="40" r="1.4"/><circle class="twinkle" cx="1010" cy="70" r="1.5"/>
    <circle class="twinkle b" cx="1120" cy="280" r="1.3"/><circle class="twinkle c" cx="900" cy="320" r="1.1"/>
    <circle class="twinkle b" cx="140" cy="190" r="1"/><circle class="twinkle" cx="1080" cy="170" r="1"/>
  </g>
  <ellipse class="orbit" cx="600" cy="180" rx="250" ry="70"/>
  <circle r="11" fill="url(#moon)"><animateMotion dur="26s" repeatCount="indefinite" path="M 350 180 A 250 70 0 1 1 850 180 A 250 70 0 1 1 350 180 Z"/></circle>
  <ellipse class="orbit" cx="600" cy="180" rx="390" ry="110"/>
  <circle r="15" fill="url(#earth)"><animateMotion dur="40s" repeatCount="indefinite" path="M 210 180 A 390 110 0 1 0 990 180 A 390 110 0 1 0 210 180 Z"/></circle>
  <ellipse class="orbit" cx="600" cy="180" rx="530" ry="150"/>
  <circle r="13" fill="url(#mars)"><animateMotion dur="60s" repeatCount="indefinite" path="M 70 180 A 530 150 0 1 1 1130 180 A 530 150 0 1 1 70 180 Z"/></circle>
  <rect class="scan" x="0" y="0" width="260" height="360" fill="url(#beam)"/>
  <text class="tag reveal" x="600" y="104" text-anchor="middle">NASA SPACE APPS 2026 · TEAM ASTROWINNERS · VISIONARY BRANCH</text>
  <text class="title reveal r2" x="600" y="186" text-anchor="middle">TWINSITE</text>
  <text class="sub reveal r3" x="600" y="232" text-anchor="middle">AGENTIC AUTO MODE · DATA HUB · 13 AGENTS · 7 FREE AI PROVIDERS</text>
  <text class="sub reveal r3" x="600" y="262" text-anchor="middle" style="font-size:14px;fill:#bfae92">Find the Earth twin of any Mars or Moon site — from raw NASA data to a cited mission report</text>
</svg>
